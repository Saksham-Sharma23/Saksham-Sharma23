<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Saksham Sharma, backend and AI/ML engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2B3A5E"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCA311" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FCA311" stop-opacity="0"/>
    </radialGradient>
    <path id="routeA" d="M590,150 C640,150 650,95 705,95 C765,95 770,150 820,150 L935,150"/>
    <path id="routeB" d="M590,150 C640,150 650,205 705,205 C765,205 770,150 820,150 L935,150"/>
    <style>
      .name{font:700 48px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#F1EDE4;letter-spacing:-1px}
      .tag{font:400 21px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#A9B4C9}
      .meta{font:500 15px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#2EC4B6}
      .lbl{font:500 12px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#8D99AE;text-anchor:middle}
      .wire{fill:none;stroke:#34466E;stroke-width:2}
      .node{fill:#1C2C50;stroke:#5B6E96;stroke-width:2}
      .rise{animation:rise .9s ease-out backwards}
      .d1{animation-delay:.1s}.d2{animation-delay:.45s}.d3{animation-delay:.8s}
      @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    </style>
  </defs>

  <rect width="1000" height="300" rx="18" fill="#14213D"/>
  <rect width="1000" height="300" rx="18" fill="url(#grid)"/>

  <!-- Left: identity -->
  <text x="56" y="128" class="name rise d1">Saksham Sharma</text>
  <text x="58" y="170" class="tag rise d2">I build backends that serve models,</text>
  <text x="58" y="198" class="tag rise d2">and pipelines that turn data into answers.</text>
  <text x="58" y="240" class="meta rise d3">Backend  /  AI &amp; ML  /  Data Science</text>

  <!-- Right: a request flowing through a system -->
  <use href="#routeA" class="wire"/>
  <use href="#routeB" class="wire"/>

  <!-- packets -->
  <g>
    <circle r="5" fill="#FCA311"><animateMotion dur="3.2s" repeatCount="indefinite" rotate="auto"><mpath href="#routeA"/></animateMotion></circle>
    <circle r="5" fill="#2EC4B6"><animateMotion dur="3.2s" begin="0.8s" repeatCount="indefinite"><mpath href="#routeB"/></animateMotion></circle>
    <circle r="4" fill="#F1EDE4"><animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite"><mpath href="#routeA"/></animateMotion></circle>
    <circle r="4" fill="#FCA311"><animateMotion dur="3.2s" begin="2.4s" repeatCount="indefinite"><mpath href="#routeB"/></animateMotion></circle>
  </g>

  <!-- nodes -->
  <circle cx="590" cy="150" r="16" class="node"/>
  <text x="590" y="186" class="lbl">request</text>

  <rect x="689" y="81" width="32" height="28" rx="6" class="node"/>
  <line x1="697" y1="90" x2="713" y2="90" stroke="#8D99AE" stroke-width="2"/>
  <line x1="697" y1="95" x2="713" y2="95" stroke="#8D99AE" stroke-width="2"/>
  <line x1="697" y1="100" x2="713" y2="100" stroke="#8D99AE" stroke-width="2"/>
  <text x="705" y="70" class="lbl">queue</text>

  <ellipse cx="705" cy="197" rx="16" ry="5" class="node"/>
  <path d="M689,197 v16 a16,5 0 0 0 32,0 v-16" class="node"/>
  <text x="705" y="238" class="lbl">store</text>

  <!-- model: pulsing core with spinning ring -->
  <circle cx="820" cy="150" r="40" fill="url(#glow)">
    <animate attributeName="r" values="30;44;30" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="150" r="20" fill="#1C2C50" stroke="#FCA311" stroke-width="2"/>
  <circle cx="820" cy="150" r="28" fill="none" stroke="#FCA311" stroke-width="1.5" stroke-dasharray="4 7" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" from="0 820 150" to="360 820 150" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="813" cy="145" r="3" fill="#FCA311"/><circle cx="827" cy="145" r="3" fill="#FCA311"/><circle cx="820" cy="157" r="3" fill="#FCA311"/>
  <text x="820" y="200" class="lbl">model</text>

  <circle cx="935" cy="150" r="14" fill="#2EC4B6" opacity="0.9">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <path d="M929,150 l4,4 l8,-9" fill="none" stroke="#14213D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="935" y="186" class="lbl">answer</text>
</svg>
